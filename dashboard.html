<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>داشبورد | رشدینک</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bg:#f2f5fb;--sf:#fff;--sf2:#e9eefb;--ink:#0d1a3a;--mu:#56617f;--ln:#d9e0f0;--br:#2450ff;--gd:#0e9f6e;--wn:#d98a00;--bd:#d9443a;--sh:0 14px 34px -24px rgba(13,26,58,.4);--f:'Vazirmatn',Tahoma,sans-serif;--d:'Lalezar','Vazirmatn',Tahoma,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#081027;--sf:#101a38;--sf2:#16224a;--ink:#eaf0ff;--mu:#9aa8d0;--ln:#24325f;--br:#5b7bff;--gd:#34d399;--wn:#f5b73b;--bd:#ff7a70}}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.9 var(--f);padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:var(--d);font-weight:400;margin:0;line-height:1.4}
h2{font-size:1.5rem}h3{font-size:1.1rem}
button,input,textarea{font:inherit;color:inherit}
.mu{color:var(--mu)}
.inp{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);min-height:46px;margin-top:6px}
.inp:focus{outline:none;border-color:var(--br)}
textarea.inp{resize:vertical;min-height:90px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;border-radius:12px;padding:10px 20px;font-weight:700;background:var(--br);color:#fff;min-height:46px;text-decoration:none}
.btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--ln)}
.btn:disabled{opacity:.6;cursor:wait}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:900px){.g3,.g2{grid-template-columns:1fr}}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--sf);border-inline-end:1px solid var(--ln);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--d);font-size:1.6rem;padding:0 10px 14px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;cursor:pointer;padding:11px 12px;border-radius:12px;text-align:right;font-weight:500;color:var(--mu)}
.nav.on{background:color-mix(in srgb,var(--br) 12%,var(--sf));color:var(--br);font-weight:700}
main{padding:26px clamp(14px,3vw,34px) 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
@media(max-width:820px){
 .shell{display:block}
 .side{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;border-top:1px solid var(--ln);border-inline-end:0;justify-content:space-around}
 .brand,.side .mu{display:none}
 .nav{flex-direction:column;gap:0;font-size:.72rem;padding:6px 8px;flex:1;align-items:center}
 main{padding-bottom:96px}
}
.bar{height:9px;border-radius:99px;background:var(--sf2);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;border-radius:99px;background:var(--br)}
.big{font-family:var(--d);font-size:2.2rem;line-height:1.2}
.tag{font-size:.75rem;padding:2px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.paid,.done{background:color-mix(in srgb,var(--gd) 16%,transparent);color:var(--gd)}
.pending,.queued,.open,.in_progress{background:color-mix(in srgb,var(--wn) 16%,transparent);color:var(--wn)}
.failed{background:color-mix(in srgb,var(--bd) 16%,transparent);color:var(--bd)}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--ln)}
.tbl{overflow-x:auto}
.lock{text-align:center;padding:30px 16px}
.li{padding:12px 14px;border-radius:14px;background:var(--sf2);margin-top:8px;font-size:.92rem}
details{border:1px solid var(--ln);border-radius:14px;padding:2px 14px;margin-top:10px;background:var(--sf)}
summary{cursor:pointer;padding:12px 0;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.msg{padding:9px 13px;border-radius:14px;margin:8px 0;max-width:88%;font-size:.92rem;white-space:pre-wrap}
.msg.user{background:color-mix(in srgb,var(--br) 14%,var(--sf));margin-inline-end:auto}
.msg.support{background:var(--sf2);margin-inline-start:auto}
.hide{display:none!important}
#toast{position:fixed;inset-inline:16px;bottom:100px;z-index:60;margin:auto;max-width:420px;padding:12px 16px;border-radius:14px;font-weight:700;text-align:center;display:none;color:#fff}
#login{max-width:420px;margin:8vh auto;padding:0 16px}
.demo{background:color-mix(in srgb,var(--wn) 15%,var(--sf));border-bottom:1px solid var(--wn);padding:6px 14px;text-align:center;font-size:.85rem}
</style>
</head>
<body>
<div id="toast"></div>

<div id="login" class="hide">
  <div class="card">
    <h2>ورود به داشبورد</h2>
    <p class="mu">با شماره موبایلی که سفارش داده‌ای وارد شو.</p>
    <div id="s1">
      <input class="inp" id="phone" inputmode="tel" maxlength="11" placeholder="09xxxxxxxxx" style="direction:ltr;text-align:right">
      <button class="btn" id="send" style="width:100%;margin-top:12px">دریافت کد</button>
    </div>
    <div id="s2" class="hide">
      <input class="inp" id="code" inputmode="numeric" maxlength="6" placeholder="کد ۶ رقمی" style="direction:ltr;text-align:right">
      <button class="btn" id="verify" style="width:100%;margin-top:12px">ورود</button>
      <button class="btn g" id="back" style="width:100%;margin-top:8px">شماره را عوض کن</button>
      <div class="li hide" id="dev"></div>
    </div>
    <button class="btn g" id="demoBtn" style="width:100%;margin-top:16px">مشاهده‌ی نمونه‌ی داشبورد</button>
  </div>
</div>

<div id="demoBar" class="demo hide">حالت نمایشی با داده‌ی نمونه — تغییرات ذخیره نمی‌شوند. <a href="/dashboard.html">خروج از نمونه</a></div>
<div class="shell hide" id="app">
  <aside class="side">
    <div class="brand">رشدینک</div>
    <button class="nav on" data-t="home">🏠<span>نمای کلی</span></button>
    <button class="nav" data-t="plan">🗓️<span>برنامه‌ی اجرا</span></button>
    <button class="nav" data-t="seo">📈<span>تحلیل سئو</span></button>
    <button class="nav" data-t="content">✍️<span>محتوا</span></button>
    <button class="nav" data-t="support">💬<span>پشتیبانی</span></button>
    <button class="nav" data-t="account">👤<span>حساب</span></button>
    <div class="mu" style="margin-top:auto;font-size:.8rem;padding:0 10px"><a href="/" style="color:inherit">← سایت اصلی</a></div>
  </aside>
  <main>
    <div class="top"><h2 id="title">نمای کلی</h2><span class="mu" id="who"></span></div>
    <section id="t-home"></section>
    <section id="t-plan" class="hide"></section>
    <section id="t-seo" class="hide"></section>
    <section id="t-content" class="hide"></section>
    <section id="t-support" class="hide"></section>
    <section id="t-account" class="hide"></section>
  </main>
</div>

<script>
var $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
var fa=n=>Number(n).toLocaleString('fa-IR');
var esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
var dt=d=>new Date(d).toLocaleDateString('fa-IR');
var ST={paid:'پرداخت‌شده',pending:'در انتظار',failed:'ناموفق',queued:'در صف تولید',done:'آماده',open:'باز'};
var TITLES={home:'نمای کلی',plan:'برنامه‌ی اجرا',seo:'تحلیل سئو',content:'درخواست محتوا',support:'پشتیبانی',account:'حساب من'};
var DEMO=false,D=null,S=null,ANA=[],CON=[],TIK=[],DLV=[];

function toast(m,bad){var t=$('#toast');t.textContent=m;t.style.background=bad?'var(--bd)':'var(--gd)';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3800)}

/* ---- نمونه‌ی نمایشی ---- */
function demoInit(){
  var n=Date.now(),d=864e5,sc=[[38,71,80,78],[46,74,82,78],[55,80,84,83],[61,85,88,83],[72,90,91,92]];
  D={sum:{phone:'09120000000',site_url:'demo-shop.ir',member_since:new Date(n-40*d).toISOString(),
    plan:{plan_id:'scale',plan_name:'تسلط',cycle:3,created_at:new Date(n-20*d).toISOString(),expires_at:new Date(n+70*d).toISOString()},
    limits:{content:20,analyses:100},usage:{content:7,analyses:12},
    orders:[{id:1,plan_name:'تسلط',cycle:3,amount_toman:150450000,status:'paid',ref_number:'482913377',created_at:new Date(n-20*d).toISOString()}]},
   ana:sc.map((s,i)=>({id:i+1,host:'demo-shop.ir',scores:{performance:s[0],seo:s[1],accessibility:s[2],bestPractices:s[3]},vitals:{lcp:(4.8-i*.7).toFixed(1)+' s',cls:'0.0'+(9-i),tbt:(520-i*90)+' ms'},
     issues:[{title:'Serve images in next-gen formats'},{title:'Reduce unused JavaScript'},{title:'Eliminate render-blocking resources'}],created_at:new Date(n-(20-i*4)*d).toISOString()})).reverse(),
   con:[{id:3,topic:'راهنمای سئو فروشگاه اینترنتی',keywords:'سئو فروشگاه, رتبه گوگل',status:'queued',result:null,created_at:new Date(n-1*d).toISOString()},
        {id:2,topic:'چگونه سرعت سایت را افزایش دهیم؟',keywords:'سرعت سایت',status:'done',result:'نمونه‌ی متن آماده‌شده: سرعت بارگذاری یکی از مهم‌ترین عوامل رتبه در گوگل است…',created_at:new Date(n-6*d).toISOString()}],
   tik:[{id:1,subject:'سوال درباره‌ی گزارش ماهانه',status:'open',created_at:new Date(n-2*d).toISOString(),messages:[{sender:'user',body:'گزارش این ماه کی آماده می‌شود؟',created_at:new Date(n-2*d).toISOString()},{sender:'support',body:'سلام! گزارش تا پایان هفته در همین داشبورد قرار می‌گیرد.',created_at:new Date(n-1*d).toISOString()}]}],
   dlv:[
     {id:1,title:'ممیزی کامل سئو فنی',item_type:'one_time',automation:'manual',period_index:1,status:'done',result:'فایل گزارش ممیزی برایتان ایمیل شد.',created_at:new Date(n-19*d).toISOString()},
     {id:2,title:'بهینه‌سازی نرخ تبدیل (CRO)',item_type:'one_time',automation:'manual',period_index:1,status:'in_progress',result:null,created_at:new Date(n-19*d).toISOString()},
     {id:3,title:'۲۰ محتوا و صفحه‌ی فرود این ماه',item_type:'monthly',automation:'ai',period_index:1,status:'done',result:'۲۰ محتوا و صفحه‌ی فرود تحویل داده شد.',created_at:new Date(n-19*d).toISOString()},
     {id:4,title:'۲۰ محتوا و صفحه‌ی فرود این ماه',item_type:'monthly',automation:'ai',period_index:2,status:'pending',result:null,created_at:new Date(n-19*d).toISOString()},
     {id:5,title:'لینک‌سازی داخلی و خارجی هدفمند این ماه',item_type:'monthly',automation:'manual',period_index:1,status:'in_progress',result:null,created_at:new Date(n-19*d).toISOString()},
     {id:6,title:'تحلیل رقبا این ماه',item_type:'monthly',automation:'ai',period_index:1,status:'done',result:'گزارش تحلیل ۳ رقیب اصلی آماده شد.',created_at:new Date(n-19*d).toISOString()},
     {id:7,title:'گزارش عملکرد این ماه',item_type:'monthly',automation:'manual',period_index:1,status:'done',result:'رشد ۱۸٪ در ترافیک ارگانیک.',created_at:new Date(n-19*d).toISOString()},
     {id:8,title:'جلسه‌ی استراتژی',item_type:'biweekly',automation:'ai',period_index:1,status:'done',result:'گزارش استراتژی دو هفته‌ی اول آماده شد.',created_at:new Date(n-19*d).toISOString()},
     {id:9,title:'جلسه‌ی استراتژی',item_type:'biweekly',automation:'ai',period_index:2,status:'pending',result:null,created_at:new Date(n-19*d).toISOString()},
   ]};
}
function demoApi(m,p,b){
  var ok=x=>({ok:true,status:200,data:x}),k=m+' '+p.replace(/\/\d+\//,'/:id/');
  switch(k){
    case 'GET /api/dashboard/summary':return ok(D.sum);
    case 'GET /api/dashboard/analyses':return ok(D.ana);
    case 'GET /api/dashboard/content':return ok(D.con);
    case 'GET /api/dashboard/tickets':return ok(D.tik);
    case 'GET /api/dashboard/plan':return ok(D.dlv);
    case 'POST /api/dashboard/profile':D.sum.site_url=b.site_url;return ok({ok:true});
    case 'POST /api/dashboard/analyses':var l=D.ana[0].scores,up=v=>Math.min(98,v+Math.ceil(Math.random()*4));
      D.ana.unshift({id:Date.now(),host:D.sum.site_url,scores:{performance:up(l.performance),seo:up(l.seo),accessibility:up(l.accessibility),bestPractices:up(l.bestPractices)},vitals:D.ana[0].vitals,issues:D.ana[0].issues,created_at:new Date().toISOString()});D.sum.usage.analyses++;return ok({});
    case 'POST /api/dashboard/content':D.con.unshift({id:Date.now(),topic:b.topic,keywords:b.keywords,status:'queued',result:null,created_at:new Date().toISOString()});D.sum.usage.content++;return ok({});
    case 'POST /api/dashboard/tickets':D.tik.unshift({id:Date.now(),subject:b.subject,status:'open',created_at:new Date().toISOString(),messages:[{sender:'user',body:b.body,created_at:new Date().toISOString()}]});return ok({});
    case 'POST /api/dashboard/tickets/:id/messages':D.tik.find(t=>t.id==p.split('/')[4]).messages.push({sender:'user',body:b.body,created_at:new Date().toISOString()});return ok({});
  }
  return ok({});
}
async function api(m,p,b){
  if(DEMO)return demoApi(m,p,b);
  try{var r=await fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return{ok:r.ok,status:r.status,data:await r.json().catch(()=>({}))}}
  catch(e){return{ok:false,status:0,data:{error:'اتصال به سرور برقرار نشد.'}}}
}

/* ---- ورود ---- */
var curPhone='';
$('#send').onclick=async function(){
  var p=$('#phone').value.trim();if(!/^09\d{9}$/.test(p))return toast('شماره موبایل معتبر نیست.',1);
  this.disabled=true;var r=await api('POST','/api/auth/otp/request',{phone:p});this.disabled=false;
  if(!r.ok)return toast(r.data.error||'ارسال کد ناموفق بود.',1);
  curPhone=p;$('#s1').classList.add('hide');$('#s2').classList.remove('hide');
  if(r.data.dev){$('#dev').classList.remove('hide');$('#dev').textContent='حالت آزمایشی (بدون پیامک) — کد: '+r.data.devCode}
};
$('#back').onclick=()=>{$('#s2').classList.add('hide');$('#s1').classList.remove('hide')};
$('#verify').onclick=async function(){
  var c=$('#code').value.trim();if(!/^\d{6}$/.test(c))return toast('کد باید ۶ رقم باشد.',1);
  var r=await api('POST','/api/auth/otp/verify',{phone:curPhone,code:c});
  if(!r.ok)return toast(r.data.error||'ورود ناموفق بود.',1);start();
};
$('#demoBtn').onclick=()=>{DEMO=true;demoInit();$('#demoBar').classList.remove('hide');start()};
function logout(){fetch('/api/auth/logout',{method:'POST'}).then(()=>location.href='/dashboard.html')}

/* ---- بارگذاری و نمایش ---- */
async function start(){
  var r=await api('GET','/api/dashboard/summary');
  if(!r.ok){$('#login').classList.remove('hide');$('#app').classList.add('hide');return}
  $('#login').classList.add('hide');$('#app').classList.remove('hide');await load();
}
async function load(){
  var a=await Promise.all([api('GET','/api/dashboard/summary'),api('GET','/api/dashboard/analyses'),api('GET','/api/dashboard/content'),api('GET','/api/dashboard/tickets'),api('GET','/api/dashboard/plan')]);
  S=a[0].data;ANA=a[1].data||[];CON=a[2].data||[];TIK=a[3].data||[];DLV=a[4].data||[];
  $('#who').textContent=S.phone;render();
}
function tab(t){$$('.nav').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$$('main section').forEach(s=>s.classList.toggle('hide',s.id!=='t-'+t));$('#title').textContent=TITLES[t]}
$$('.nav').forEach(b=>b.onclick=()=>tab(b.dataset.t));
var avg=s=>Math.round((s.performance+s.seo+s.accessibility+s.bestPractices)/4);
var col=v=>v>=75?'var(--gd)':v>=50?'var(--wn)':'var(--bd)';
function meter(lbl,u,l){var pc=l?Math.min(100,u/l*100):0;return '<div><div style="display:flex;justify-content:space-between"><span>'+lbl+'</span><b>'+fa(u)+' از '+fa(l||0)+'</b></div><div class="bar"><i style="width:'+pc+'%;background:'+(pc>=90?'var(--bd)':'var(--br)')+'"></i></div></div>'}
function lockBox(){return '<div class="card lock"><div class="big">🔒</div><h3>این بخش برای دارندگان پلن فعال است</h3><p class="mu">برای شروع، یکی از پلن‌ها را انتخاب کن.</p><a class="btn" href="/#plans">مشاهده‌ی پلن‌ها</a></div>'}

function chart(list){
  var pts=list.slice().reverse().map(x=>avg(x.scores));if(pts.length<2)return '<p class="mu">برای دیدن روند، حداقل دو تحلیل لازم است.</p>';
  var W=600,H=170,px=i=>30+i*(W-50)/(pts.length-1),py=v=>H-20-v*(H-40)/100;
  var line=pts.map((v,i)=>(i?'L':'M')+px(i)+' '+py(v)).join(' ');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;direction:ltr">'+[25,50,75,100].map(g=>'<line x1="30" x2="'+(W-20)+'" y1="'+py(g)+'" y2="'+py(g)+'" stroke="var(--ln)"/><text x="4" y="'+(py(g)+4)+'" font-size="11" fill="var(--mu)">'+g+'</text>').join('')+
   '<path d="'+line+'" fill="none" stroke="var(--br)" stroke-width="3" stroke-linejoin="round"/>'+pts.map((v,i)=>'<circle cx="'+px(i)+'" cy="'+py(v)+'" r="4.5" fill="var(--br)"/>').join('')+'</svg>';
}

function render(){
  var pl=S.plan,L=S.limits,U=S.usage,last=ANA[0],prev=ANA[1];
  var delta=last&&prev?avg(last.scores)-avg(prev.scores):null;
  /* نمای کلی */
  $('#t-home').innerHTML=(pl?'':'<div style="margin-bottom:16px">'+lockBox()+'</div>')+
   '<div class="grid g3"><div class="card"><span class="mu">پلن فعال</span><div class="big">'+(pl?esc(pl.plan_name):'—')+'</div><span class="mu">'+(pl?'تا '+dt(pl.expires_at)+' ('+fa(Math.max(0,Math.ceil((new Date(pl.expires_at)-Date.now())/864e5)))+' روز مانده)':'پلن فعالی نداری')+'</span></div>'+
   '<div class="card"><span class="mu">امتیاز فعلی سایت</span><div class="big" style="color:'+(last?col(avg(last.scores)):'inherit')+'">'+(last?fa(avg(last.scores)):'—')+'</div><span class="mu">'+(delta==null?'هنوز تحلیلی انجام نشده':(delta>=0?'▲ ':'▼ ')+fa(Math.abs(delta))+' امتیاز نسبت به تحلیل قبل')+'</span></div>'+
   '<div class="card"><span class="mu">درخواست‌های باز پشتیبانی</span><div class="big">'+fa(TIK.filter(t=>t.status==='open').length)+'</div><span class="mu">'+fa(CON.filter(c=>c.status==='queued').length)+' محتوا در صف تولید</span></div></div>'+
   '<div class="grid g2" style="margin-top:16px"><div class="card"><h3>مصرف پلن در این ماه</h3>'+(pl?meter('محتوا',U.content,L.content)+meter('تحلیل سئو',U.analyses,L.analyses):'<p class="mu">با فعال شدن پلن، سهمیه‌ات اینجا نمایش داده می‌شود.</p>')+'</div>'+
   '<div class="card"><h3>روند امتیاز سئو</h3>'+chart(ANA)+'</div></div>';

  /* برنامه‌ی اجرا */
  var DST={pending:'در انتظار',in_progress:'در حال انجام',done:'تحویل‌شده'};
  var AUT={ai:'خودکار (هوش مصنوعی)',manual:'دستی توسط تیم'};
  if(!pl){$('#t-plan').innerHTML=lockBox()}
  else if(!DLV.length){$('#t-plan').innerHTML='<div class="card"><p class="mu">برنامه‌ی اجرای پلنت در حال آماده‌سازی است.</p></div>'}
  else{
    var byMonth={};DLV.forEach(d=>{var k=d.item_type==='one_time'?'یک‌بار':(d.item_type==='biweekly'?'دو هفته '+fa(d.period_index):'ماه '+fa(d.period_index));(byMonth[k]=byMonth[k]||[]).push(d)});
    var done=DLV.filter(d=>d.status==='done').length;
    $('#t-plan').innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>پیشرفت کلی</h3><b>'+fa(done)+' از '+fa(DLV.length)+'</b></div><div class="bar"><i style="width:'+Math.round(done/DLV.length*100)+'%"></i></div></div>'+
     Object.keys(byMonth).map(k=>'<div class="card" style="margin-top:16px"><h3>'+k+'</h3>'+byMonth[k].map(d=>
       '<div class="li" style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div>'+esc(d.title)+'</div><span class="mu" style="font-size:.78rem">'+AUT[d.automation]+(d.result?'<br>'+esc(d.result):'')+'</span></div><span class="tag '+d.status+'">'+DST[d.status]+'</span></div>'
     ).join('')+'</div>').join('');
  }

  /* تحلیل سئو */
  var cats=[['performance','سرعت'],['seo','سئوی فنی'],['accessibility','دسترس‌پذیری'],['bestPractices','استانداردهای فنی']];
  $('#t-seo').innerHTML=!pl?lockBox():
   '<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end"><div style="flex:1;min-width:200px"><span class="mu">سایت شما</span><input class="inp" id="dom" style="direction:ltr;text-align:right" placeholder="example.ir" value="'+esc(S.site_url||'')+'"></div><button class="btn" id="runSeo">تحلیل جدید</button></div>'+
   '<p class="mu" style="margin:8px 0 0">سهمیه‌ی این ماه: '+fa(U.analyses)+' از '+fa(L.analyses)+'</p></div>'+
   (last?'<div class="grid g2" style="margin-top:16px"><div class="card"><h3>آخرین نتیجه ('+dt(last.created_at)+')</h3>'+cats.map(c=>'<div style="margin-top:10px"><div style="display:flex;justify-content:space-between"><span>'+c[1]+'</span><b style="color:'+col(last.scores[c[0]])+'">'+fa(last.scores[c[0]])+'</b></div><div class="bar"><i style="width:'+last.scores[c[0]]+'%;background:'+col(last.scores[c[0]])+'"></i></div></div>').join('')+
    '<p class="mu" style="margin:10px 0 0;direction:ltr;text-align:right">LCP '+esc(last.vitals.lcp||'—')+' · CLS '+esc(last.vitals.cls||'—')+' · TBT '+esc(last.vitals.tbt||'—')+'</p></div>'+
    '<div class="card"><h3>مهم‌ترین مشکل‌ها</h3>'+((last.issues||[]).slice(0,4).map(i=>'<div class="li" style="direction:ltr;text-align:left">'+esc(i.title)+'</div>').join('')||'<p class="mu">مشکل مهمی پیدا نشد.</p>')+'</div></div>'+
    '<div class="card tbl" style="margin-top:16px"><h3>تاریخچه</h3><table><thead><tr><th>تاریخ</th><th>سایت</th><th>سرعت</th><th>سئو</th><th>کل</th></tr></thead><tbody>'+ANA.map(a=>'<tr><td>'+dt(a.created_at)+'</td><td style="direction:ltr">'+esc(a.host)+'</td><td>'+fa(a.scores.performance)+'</td><td>'+fa(a.scores.seo)+'</td><td><b style="color:'+col(avg(a.scores))+'">'+fa(avg(a.scores))+'</b></td></tr>').join('')+'</tbody></table></div>':'<div class="card lock" style="margin-top:16px"><p class="mu">هنوز تحلیلی انجام نشده. اولین تحلیل را بزن.</p></div>');

  /* محتوا */
  $('#t-content').innerHTML=!pl?lockBox():
   '<div class="card"><h3>درخواست محتوای جدید</h3><p class="mu" style="margin:4px 0 0">سهمیه‌ی این ماه: '+fa(U.content)+' از '+fa(L.content)+'. تولید خودکار با هوش مصنوعی به‌زودی فعال می‌شود؛ تا آن زمان درخواستت ثبت و در صف می‌ماند.</p>'+
   '<form data-f="content"><input class="inp" name="topic" placeholder="موضوع مقاله" maxlength="255"><input class="inp" name="keywords" placeholder="کلمات کلیدی (با ویرگول جدا کن)" maxlength="255"><button class="btn" style="margin-top:12px">ثبت درخواست</button></form></div>'+
   '<div class="card" style="margin-top:16px"><h3>درخواست‌های من</h3>'+(CON.length?CON.map(c=>'<details><summary><span>'+esc(c.topic)+'</span><span class="tag '+c.status+'">'+ST[c.status]+'</span></summary><p class="mu">کلمات کلیدی: '+esc(c.keywords||'—')+' · '+dt(c.created_at)+'</p>'+(c.result?'<div class="li" style="white-space:pre-wrap">'+esc(c.result)+'</div>':'<p class="mu">متن هنوز آماده نشده.</p>')+'</details>').join(''):'<p class="mu">هنوز درخواستی ثبت نکرده‌ای.</p>')+'</div>';

  /* پشتیبانی */
  $('#t-support').innerHTML='<div class="card"><h3>تیکت جدید</h3><form data-f="ticket"><input class="inp" name="subject" placeholder="موضوع" maxlength="120"><textarea class="inp" name="body" placeholder="پیامت را بنویس…" maxlength="2000"></textarea><button class="btn" style="margin-top:12px">ارسال تیکت</button></form></div>'+
   '<div class="card" style="margin-top:16px"><h3>تیکت‌های من</h3>'+(TIK.length?TIK.map(t=>'<details data-id="'+t.id+'"><summary><span>'+esc(t.subject)+'</span><span class="tag '+t.status+'">'+ST[t.status]+'</span></summary>'+t.messages.map(m=>'<div class="msg '+m.sender+'">'+esc(m.body)+'<div class="mu" style="font-size:.72rem">'+(m.sender==='user'?'شما':'پشتیبانی')+' · '+dt(m.created_at)+'</div></div>').join('')+'<form data-f="reply" data-id="'+t.id+'" style="padding-bottom:12px"><input class="inp" name="body" placeholder="پاسخ…" maxlength="2000"><button class="btn g" style="margin-top:8px">ارسال پاسخ</button></form></details>').join(''):'<p class="mu">هنوز تیکتی نداری.</p>')+'</div>';

  /* حساب */
  $('#t-account').innerHTML='<div class="grid g2"><div class="card"><h3>پروفایل</h3><p class="mu" style="margin:6px 0">شماره موبایل: <b style="color:var(--ink)">'+esc(S.phone)+'</b><br>عضویت از: '+dt(S.member_since)+'</p><form data-f="profile"><span class="mu">آدرس سایت</span><input class="inp" name="site_url" style="direction:ltr;text-align:right" placeholder="example.ir" value="'+esc(S.site_url||'')+'"><button class="btn" style="margin-top:12px">ذخیره</button></form><button class="btn g" style="margin-top:12px" onclick="logout()">خروج از حساب</button></div>'+
   '<div class="card tbl"><h3>سفارش‌ها</h3>'+(S.orders.length?'<table><thead><tr><th>پلن</th><th>دوره</th><th>مبلغ</th><th>وضعیت</th><th>تاریخ</th></tr></thead><tbody>'+S.orders.map(o=>'<tr><td>'+esc(o.plan_name)+'</td><td>'+fa(o.cycle)+' ماهه</td><td>'+fa(o.amount_toman)+' ت</td><td><span class="tag '+o.status+'">'+ST[o.status]+'</span></td><td>'+dt(o.created_at)+'</td></tr>').join('')+'</tbody></table>':'<p class="mu">هنوز سفارشی نداری.</p>')+'</div></div>';
}

/* ---- عملیات ---- */
async function act(btn,fn,okMsg){
  var old=btn.textContent;btn.disabled=true;btn.textContent='لطفاً صبر کن…';
  var r=await fn();btn.disabled=false;btn.textContent=old;
  if(!r.ok){toast(r.data.error||'انجام نشد.',1);return false}
  if(okMsg)toast(okMsg);var open=$$('details[open]').map(d=>d.dataset.id);await load();
  $$('details').forEach(d=>{if(open.includes(d.dataset.id))d.open=true});return true;
}
document.addEventListener('click',function(e){
  if(e.target.id==='runSeo'){var v=$('#dom').value.trim();act(e.target,()=>api('POST','/api/dashboard/analyses',{domain:v}),'تحلیل انجام شد.').then(()=>tab('seo'))}
});
document.addEventListener('submit',function(e){
  var f=e.target,k=f.dataset.f;if(!k)return;e.preventDefault();
  var v=Object.fromEntries(new FormData(f)),btn=f.querySelector('button');
  if(k==='content')act(btn,()=>api('POST','/api/dashboard/content',v),'درخواست ثبت شد.').then(ok=>{if(ok)tab('content')});
  if(k==='ticket')act(btn,()=>api('POST','/api/dashboard/tickets',v),'تیکت ارسال شد.').then(ok=>{if(ok)tab('support')});
  if(k==='reply')act(btn,()=>api('POST','/api/dashboard/tickets/'+f.dataset.id+'/messages',v),'پاسخ ارسال شد.').then(()=>tab('support'));
  if(k==='profile')act(btn,()=>api('POST','/api/dashboard/profile',v),'ذخیره شد.').then(()=>tab('account'));
});

(function(){var q=new URLSearchParams(location.search),p=q.get('payment');
  if(p){setTimeout(()=>toast(p==='success'?'پرداخت موفق بود'+(q.get('ref')?' — کد پیگیری: '+q.get('ref'):''):'پرداخت انجام نشد یا لغو شد.',p!=='success'),600);history.replaceState(null,'',location.pathname)}
  if(q.get('demo')==='1'){$('#demoBtn').click()}else start();
})();
</script>
